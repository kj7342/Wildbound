<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#183b35"><title>Wildbound — Realms of Discovery</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#172e2a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{width:100%;height:100dvh}#game{position:fixed;inset:0;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.panel{background:#102b26d9;border:1px solid #ffffff30;border-radius:16px;padding:10px 13px;box-shadow:0 5px 20px #0004;backdrop-filter:blur(10px)}#brand{font-weight:900;letter-spacing:.08em;font-size:13px;color:#d8f6d9}#zone{font-size:11px;color:#b4d4bf;margin-top:2px}#quest{max-width:52%;font-size:12px;color:#f5f4dc;text-align:right}#quest b{display:block;color:#ffe18b;font-size:10px;letter-spacing:.12em;margin-bottom:3px}
#teamToggle{position:absolute;right:12px;top:max(76px,calc(env(safe-area-inset-top) + 76px));pointer-events:auto;border:1px solid #ffffff55;border-radius:13px;padding:8px 11px;background:#102b26e8;color:#f7f2d8;font-size:11px;font-weight:800;box-shadow:0 4px 14px #0004}#party{position:absolute;right:12px;top:max(119px,calc(env(safe-area-inset-top) + 119px));display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:min(310px,calc(100vw - 24px));max-height:42dvh;overflow:auto;padding:7px;background:#102b26d9;border:1px solid #ffffff35;border-radius:15px;backdrop-filter:blur(12px);pointer-events:auto}#party.open{display:grid}.creature{display:flex;align-items:center;gap:6px;background:#ffffff0d;border:1px solid #ffffff20;border-radius:10px;padding:6px;min-width:0;font-size:10px}.creature strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:82px}.orb{flex:0 0 25px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffc66d,#e56b45);font-size:15px}.bar{height:4px;background:#36564c;border-radius:9px;margin-top:4px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#83d99c}
#bottom{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:116px;height:116px;border-radius:50%;background:#102b2677;border:1px solid #ffffff55;position:relative;pointer-events:auto;touch-action:none;overscroll-behavior:none; -webkit-user-select:none;user-select:none}#nub{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#d9f4dfaa;border:2px solid #fff9;box-shadow:0 3px 12px #0005}#actions{display:flex;gap:10px;align-items:end;pointer-events:auto}.act{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff80;background:#163d35d9;color:white;font-size:22px;box-shadow:0 4px 12px #0005}.act small{display:block;font-size:8px;letter-spacing:.06em;margin-top:1px}#hint{display:none;position:absolute;top:max(78px,calc(env(safe-area-inset-top) + 78px));left:50%;transform:translateX(-50%);background:#102b26bb;color:#e8f5df;border-radius:20px;padding:7px 12px;font-size:11px;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-10px);opacity:0;transition:.25s;background:#102b26ed;color:white;padding:12px 18px;border:1px solid #ffffff40;border-radius:14px;font-size:13px;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}#menu{position:absolute;left:12px;top:max(74px,calc(env(safe-area-inset-top) + 74px));bottom:auto;pointer-events:auto}#menu button{border:1px solid #ffffff40;border-radius:12px;padding:8px 11px;background:#102b26bb;color:white;font-size:11px}
@media(min-width:800px){#stick{width:130px;height:130px}#nub{left:39px;top:39px}#hint{top:76px}#party{top:158px;width:330px}}
#battle{display:none;position:absolute;z-index:8;inset:0;background:#071b19b8;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}#battle.open{display:flex}#battleCard{width:min(520px,94vw);max-height:88dvh;overflow:auto;background:linear-gradient(145deg,#183f36f5,#102923f5);border:1px solid #ffffff55;border-radius:22px;padding:18px;color:#f5f3dc;box-shadow:0 18px 60px #0009}#battleTitle{font-size:10px;letter-spacing:.18em;color:#f5d58a;font-weight:900}#battleEnemy{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;padding:12px;background:#ffffff0c;border-radius:15px}#enemyEmoji{font-size:48px}#battleAlly{display:flex;align-items:center;gap:10px;padding:10px;background:#ffffff0c;border-radius:14px;margin:10px 0}#allyEmoji{font-size:34px}#battleText{font-size:13px;line-height:1.4;min-height:38px;color:#e4edda;margin:12px 0}#battleMoves{display:grid;grid-template-columns:1fr 1fr;gap:9px}#battleMoves button,#battleDone{border:1px solid #ffffff35;border-radius:12px;padding:12px;background:#28614d;color:white;font-weight:750;font-size:13px}#battleMoves button:disabled{opacity:.45}#battleDone{display:none;width:100%;margin-top:10px;background:#b77c39}#battle .bar{height:7px}#battle .bar i{transition:width .2s}body.in-battle #bottom,body.in-battle #menu{display:none}
</style></head><body><div id="game"></div>
<div id="top"><div class="panel"><div id="brand">WILDBOUND <span style="font-size:9px;color:#f4d58c;letter-spacing:.04em">v1.4.4</span></div><div id="zone">REALMS OF DISCOVERY · GREENHAVEN</div></div><div id="quest" class="panel"><b>✦ FIRST STEPS</b>Explore Greenhaven Meadow</div></div>
<button id="teamToggle" aria-expanded="false" aria-controls="party">◉ TEAM <span id="teamCount">1/6</span> ▾</button><div id="party" aria-label="Your creature team"></div>
<div id="menu"><button id="save">◈ SAVE GAME</button></div>
<div id="hint" style="display:block">Explore the meadow · Walk close to a wild creature to encounter it</div><div id="toast"></div>
<div id="battle" role="dialog" aria-modal="true" aria-label="Creature battle"><div id="battleCard"><div id="battleTitle">✦ WILD ENCOUNTER</div><div id="battleEnemy"><div><strong id="enemyName">Wild creature</strong><div id="enemyLevel" style="font-size:10px;color:#b4d4bf;margin-top:3px">Lv. 3</div><div class="bar" style="width:190px"><i id="enemyBar"></i></div><div id="enemyHp" style="font-size:10px;margin-top:4px">20 / 20 HP</div></div><div id="enemyEmoji">🌿</div></div><div id="battleText">A wild creature approaches!</div><div id="battleAlly"><div id="allyEmoji">🦊</div><div style="flex:1"><strong id="allyName">Emberkit</strong><div id="allyLevel" style="font-size:10px;color:#b4d4bf">Lv. 5</div><div class="bar"><i id="allyBar"></i></div><div id="allyHp" style="font-size:10px;margin-top:4px">24 / 24 HP</div></div></div><div id="battleMoves"><button data-move="quick">Quick Strike · 6–9</button><button data-move="special">Nature Burst · 9–13</button></div><button id="battleDone">Continue exploring</button></div></div>
<div id="bottom"><div id="stick"><div id="nub"></div></div><div id="actions"><button class="act" id="jump">↟<small>JUMP</small></button></div></div>
<script>
(function(){
  var root=document.getElementById('game');
  var panel=document.createElement('div');
  panel.id='wildbound-startup-status';
  panel.style.cssText='position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,420px);padding:16px 18px;border-radius:14px;background:#102b26ed;border:1px solid #ffffff66;color:#fff3d6;font:14px/1.5 system-ui;text-align:center;box-shadow:0 8px 30px #0008';
  panel.textContent='Starting Wildbound 3D engine…';
  root.appendChild(panel);
  window.__wildboundStatus=function(message,isError){
    panel.style.display='block';
    panel.style.color=isError?'#ffd0c8':'#fff3d6';
    panel.textContent=message;
  };
  window.__wildboundReady=false;
  window.__wildboundScriptLoaded=false;
  window.__wildboundStartupFailed=false;
  window.addEventListener('error',function(e){
    window.__wildboundStartupFailed=true;
    window.__wildboundStatus('Startup error: '+(e.message||'JavaScript failed to load')+'. Please tell ChatGPT this exact message.',true);
  });
  window.addEventListener('unhandledrejection',function(e){
    window.__wildboundStartupFailed=true;
    var reason=e.reason&&e.reason.message?e.reason.message:String(e.reason||'unknown error');
    window.__wildboundStatus('3D engine error: '+reason+'. Please tell ChatGPT this exact message.',true);
  });
  setTimeout(function(){
    if(!window.__wildboundReady&&!window.__wildboundStartupFailed){
      window.__wildboundStatus(window.__wildboundScriptLoaded?'The game script downloaded, but startup did not finish. Please tell ChatGPT this exact message.':'The game script did not download. Please tell ChatGPT this exact message.',true);
    }
  },30000);
})();
</script>
<script src="./wildbound-game.js?v=144" defer onload="window.__wildboundScriptLoaded=true" onerror="window.__wildboundStartupFailed=true;window.__wildboundStatus('The game script failed to download. Please tell ChatGPT this exact message.',true)"></script></body></html>
