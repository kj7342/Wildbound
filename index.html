const wilds=[

];
let move={x:0,y:0},keys={},yaw=0,camYaw=0,jumping=0,velY=0,walk=0,near=null;const clock=new THREE.Clock();
function blocked(x,z){if(Math.abs(x)>99||Math.abs(z)>99)return true;for(const c of worldColliders){if(c.type==='circle'&&Math.hypot(x-c.x,z-c.z)<c.r+.48)return true;if(c.type==='rect'&&Math.abs(x-c.x)<c.w/2+.45&&Math.abs(z-c.z)<c.d/2+.45)return true;}if(Math.hypot((x+29)/1.25,z+21)<13.6)return true;return false;}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1900)}
const team=[{name:'Emberkit',emoji:'🦊',level:5,hp:24,maxHp:24}];
const reserve=[];let battle=null,battleBusy=false;
const partyEl=document.querySelector('#party'),hintEl=document.querySelector('#hint'),questEl=document.querySelector('#quest');
function renderTeam(){document.querySelector('#teamCount').textContent=team.length+'/6';partyEl.innerHTML=team.map(c=>'<div class="creature"><div class="orb">'+c.emoji+'</div><div><strong>'+c.name+'</strong><div style="font-size:9px;color:#b4d4bf">Lv. '+c.level+' · '+c.hp+'/'+c.maxHp+' HP</div><div class="bar"><i style="width:'+(c.hp/c.maxHp*100)+'%"></i></div></div></div>').join('')}
function saveGame(show=true){localStorage.setItem('wildbound-save',JSON.stringify({x:player.position.x,z:player.position.z,team:team,reserve:reserve,caught:wilds.filter(w=>w.userData.recruited).map(w=>w.userData.name)}));if(show)toast('Adventure saved on this device!')}
function nearestWild(){let nearest=null,dist=4.2;for(const w of wilds){if(w.userData.recruited||!w.visible)continue;const d=w.position.distanceTo(player.position);if(d<dist){dist=d;nearest=w}}return nearest}
function updateBattleUI(){if(!battle)return;const c=team[0],e=battle.wild.userData;document.querySelector('#enemyName').textContent=e.name;document.querySelector('#enemyLevel').textContent='Lv. '+battle.level;document.querySelector('#enemyEmoji').textContent=e.emoji;document.querySelector('#enemyHp').textContent=Math.max(0,battle.hp)+' / '+battle.maxHp+' HP';document.querySelector('#enemyBar').style.width=Math.max(0,battle.hp/battle.maxHp*100)+'%';document.querySelector('#allyName').textContent=c.name;document.querySelector('#allyLevel').textContent='Lv. '+c.level;document.querySelector('#allyEmoji').textContent=c.emoji;document.querySelector('#allyHp').textContent=Math.max(0,c.hp)+' / '+c.maxHp+' HP';document.querySelector('#allyBar').style.width=Math.max(0,c.hp/c.maxHp*100)+'%';}
function startBattle(w){if(battle||!w||w.userData.recruited)return;battle={wild:w,level:2+(Math.random()*3|0),maxHp:19+(Math.random()*9|0),hp:0};battle.hp=battle.maxHp;battleBusy=false;document.body.classList.add('in-battle');document.querySelector('#battle').classList.add('open');document.querySelector('#battleMoves').style.display='grid';document.querySelector('#battleDone').style.display='none';document.querySelector('#battleText').textContent='A wild '+w.userData.name+' appeared! Choose a move.';document.querySelectorAll('[data-move]').forEach(b=>b.disabled=false);updateBattleUI();}
function endBattle(){if(!battle)return;document.querySelector('#battle').classList.remove('open');document.body.classList.remove('in-battle');battle=null;battleBusy=false;}
function finishVictory(){const w=battle.wild,e=w.userData;w.userData.recruited=true;w.visible=false;const friend={name:e.name,emoji:e.emoji,level:battle.level,hp:Math.max(1,Math.round(battle.maxHp*.75)),maxHp:battle.maxHp};if(team.length<6){team.push(friend);document.querySelector('#battleText').textContent=e.name+' joined your party! Your team has '+team.length+' of 6 companions.';}else{reserve.push(friend);document.querySelector('#battleText').textContent=e.name+' joined your creature reserve because your six-member party is full.';}team[0].level+=1;team[0].maxHp+=2;team[0].hp=Math.min(team[0].maxHp,team[0].hp+5);renderTeam();questEl.innerHTML='<b>✦ FIRST STEPS</b>'+(team.length>=6?'Build your team and explore':'Find more wild friends');document.querySelector('#battleMoves').style.display='none';document.querySelector('#battleDone').style.display='block';saveGame(false);}
function takeTurn(kind){if(!battle||battleBusy)return;const c=team[0],e=battle.wild.userData;battleBusy=true;document.querySelectorAll('[data-move]').forEach(b=>b.disabled=true);const damage=kind==='special'?(9+Math.random()*5|0):(6+Math.random()*4|0);battle.hp=Math.max(0,battle.hp-damage);document.querySelector('#battleText').textContent=c.name+' used '+(kind==='special'?'Nature Burst':'Quick Strike')+' for '+damage+' damage!';updateBattleUI();if(battle.hp<=0){finishVictory();battleBusy=false;return;}setTimeout(()=>{if(!battle)return;const hit=4+Math.random()*5|0;c.hp=Math.max(0,c.hp-hit);document.querySelector('#battleText').textContent=e.name+' counterattacked for '+hit+' damage!';updateBattleUI();if(c.hp<=0){c.hp=1;document.querySelector('#battleText').textContent=c.name+' is exhausted. You retreat safely; rest your team before the next encounter.';document.querySelector('#battleMoves').style.display='none';document.querySelector('#battleDone').style.display='block';renderTeam();saveGame(false);}else{document.querySelectorAll('[data-move]').forEach(b=>b.disabled=false);document.querySelector('#battleText').textContent+=' Choose your next move.';}battleBusy=false;},700);}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>takeTurn(b.dataset.move)));document.querySelector('#battleDone').onclick=()=>endBattle();document.querySelector('#jump').onclick=()=>{if(player.position.y<.03){velY=7.2;toast('Whee!')}};
document.querySelector('#save').onclick=()=>saveGame(true);const teamToggle=document.querySelector('#teamToggle');teamToggle.addEventListener('click',()=>{const open=partyEl.classList.toggle('open');teamToggle.setAttribute('aria-expanded',String(open));teamToggle.innerHTML='◉ TEAM <span id="teamCount">'+team.length+'/6</span> '+(open?'▴':'▾');});
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let active=false;stick.addEventListener('contextmenu',e=>e.preventDefault());stick.addEventListener('pointerdown',e=>{e.preventDefault()});function stickMove(e){e.preventDefault();const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),k=Math.min(1,len/40);move.x=dx/(len||1)*k;move.y=dy/(len||1)*k;nub.style.transform='translate('+move.x*34+'px,'+move.y*34+'px)'}stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(active)stickMove(e)});function release(){active=false;move={x:0,y:0};nub.style.transform=''}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);stick.addEventListener('lostpointercapture',release);document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();document.querySelector('#jump').click()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dragging=false,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dragging=true;lastX=e.clientX}});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging){camYaw-=(e.clientX-lastX)*.005;lastX=e.clientX}});
const saved=localStorage.getItem('wildbound-save');if(saved){try{const s=JSON.parse(saved);player.position.set(Number.isFinite(s.x)?s.x:0,0,Number.isFinite(s.z)?s.z:12);if(Array.isArray(s.team)&&s.team.length){team.splice(0,team.length,...s.team.slice(0,6))}if(Array.isArray(s.reserve))reserve.push(...s.reserve);if(Array.isArray(s.caught)){for(const w of wilds){if(s.caught.includes(w.userData.name)){w.userData.recruited=true;w.visible=false}}}}catch{}}renderTeam();questEl.innerHTML='<b>✦ FIRST STEPS</b>'+(team.length>1?'Find more wild friends':'Explore Greenhaven Meadow');
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const forward=-(move.y||((keys.w||keys.arrowup)?1:0)-((keys.s||keys.arrowdown)?1:0));const side=(move.x||((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0));const mag=Math.hypot(forward,side);if(!battle&&mag>.05){const dx=(side*Math.cos(camYaw)+forward*Math.sin(camYaw))/Math.max(1,mag),dz=(side*Math.sin(camYaw)-forward*Math.cos(camYaw))/Math.max(1,mag);const nx=player.position.x+dx*7*dt,nz=player.position.z+dz*7*dt;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;if(Math.abs(dx)+Math.abs(dz)>.01)player.rotation.y=Math.atan2(dx,dz);walk+=dt*10;player.position.y=Math.abs(Math.sin(walk))*.045; }else if(!battle)player.position.y=0;
if(player.position.y>0){}if(jumping>0)jumping-=dt;if(velY!==0||player.position.y>.1){player.position.y+=velY*dt;velY-=19*dt;if(player.position.y<0){player.position.y=0;velY=0}}
const target=player.position.clone().add(new THREE.Vector3(-Math.sin(camYaw)*13,10,Math.cos(camYaw)*13));camera.position.lerp(target,.08);camera.lookAt(player.position.x,1.1,player.position.z);
const bpos=player.position.clone().add(new THREE.Vector3(-Math.sin(player.rotation.y+.7)*1.5,0,-Math.cos(player.rotation.y+.7)*1.5));buddy.position.lerp(bpos,.09);buddy.position.y=.05+Math.sin(clock.elapsedTime*3)*.07;buddy.rotation.y=player.rotation.y;
for(const w of wilds){if(!w.userData.recruited){w.rotation.y+=dt*.25;w.position.y=.04+Math.sin(clock.elapsedTime*2+w.userData.phase)*.06;const t=clock.elapsedTime*.22+w.userData.phase,tx=w.userData.homeX+Math.sin(t)*1.15,tz=w.userData.homeZ+Math.cos(t*.8)*1.15;w.position.x+=(tx-w.position.x)*.012;w.position.z+=(tz-w.position.z)*.012;}}
const nearby=nearestWild();hintEl.textContent=battle?'Battle in progress':nearby?'A wild '+nearby.userData.name+' is nearby — encounter starting!':'Explore the meadow · Walk close to a wild creature to encounter it';if(nearby&&!battle)startBattle(nearby);
water.color.setHSL(.52,.48,.49+Math.sin(clock.elapsedTime*1.2)*.025);renderer.render(scene,camera)}
