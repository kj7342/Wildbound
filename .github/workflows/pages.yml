name: Deploy Wildbound to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build standalone game script
        run: |
          npm install --no-save esbuild@0.21.5 three@0.164.1
          ./node_modules/.bin/esbuild src/game.js --bundle --format=iife --target=es2020 --outfile=wildbound-game.js
          test -s wildbound-game.js
          echo "Built game bundle:"
          ls -lh wildbound-game.js
          rm -rf node_modules package-lock.json package.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
