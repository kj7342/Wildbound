<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173d35">
<title>Wildbound — 2D Style Preview</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172f2b;color:#f4f4df;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#315b4b,#142c29 78%)}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#8fbd76}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.hud{position:absolute;z-index:3;pointer-events:none}.glass{background:#17352ee8;border:1px solid #d7edc44a;border-radius:14px;box-shadow:0 5px 18px #10251c55;backdrop-filter:blur(8px)}
#brand{top:max(10px,env(safe-area-inset-top));left:12px;padding:9px 12px;min-width:150px}
#brand strong{display:block;font-size:12px;letter-spacing:.12em;color:#e7f4c9}#brand span{font-size:10px;color:#b8d7b1}
#party{top:max(10px,env(safe-area-inset-top));right:12px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.orb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;border:2px solid #d8edc7;background:#d4a66b}
#party small{font-size:10px;color:#d6e8c8;display:block}#party b{font-size:11px}
#quest{left:12px;top:70px;padding:8px 11px;max-width:min(245px,62vw);font-size:11px;color:#e9f2d4}
#quest b{color:#f4d58c}
#toast{left:50%;top:19%;transform:translate(-50%,-8px);padding:10px 15px;font-size:12px;opacity:0;transition:.22s;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#controls{position:absolute;z-index:4;inset:auto 0 max(14px,env(safe-area-inset-bottom)) 0;display:flex;justify-content:space-between;align-items:end;padding:0 17px;pointer-events:none}
#pad{width:142px;height:142px;position:relative;pointer-events:auto;touch-action:none}
.key{position:absolute;width:46px;height:46px;border:1px solid #e2edc77a;background:#183d35d9;color:#f4f4df;border-radius:13px;font-size:19px;display:grid;place-items:center;box-shadow:0 3px 0 #10271f;touch-action:none}
#up{left:48px;top:0}#down{left:48px;bottom:0}#left{left:0;top:48px}#right{right:0;top:48px}
#actions{display:flex;gap:10px;align-items:end;pointer-events:auto}
.action{border:1px solid #f5e5a477;background:#8a6139e8;color:#fff5d9;border-radius:50%;width:58px;height:58px;font-weight:800;font-size:11px;box-shadow:0 4px 0 #523b2a;touch-action:none}
.action.alt{width:48px;height:48px;background:#285b4a}
#hint{position:absolute;z-index:3;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;color:#e8f0d6;background:#17352ebd;padding:6px 10px;border-radius:20px;white-space:nowrap;pointer-events:none}
#footer{position:absolute;right:12px;top:70px;font-size:10px;color:#e7f0d4;background:#17352ebd;border-radius:10px;padding:7px 9px}
@media(min-width:800px){#game{width:min(100vw,1200px);height:min(100dvh,760px);border-radius:18px;box-shadow:0 20px 70px #0008;overflow:hidden}#pad{opacity:.75}}
@media(max-height:500px){#pad{width:112px;height:112px}.key{width:38px;height:38px}#up{left:37px}#down{left:37px}#left{top:37px}#right{top:37px}#controls{padding:0 12px}.action{width:49px;height:49px}.action.alt{width:42px;height:42px}#quest{top:62px}}
</style>
</head>
<body>
<div id="stage"><main id="game">
<canvas id="world" aria-label="Interactive 2D Wildbound game preview"></canvas>
<div id="brand" class="hud glass"><strong>WILDBOUND</strong><span>REALMS OF DISCOVERY · 2D CONCEPT</span></div>
<div id="party" class="hud glass"><div class="orb">🐾</div><div><b>Spriglet · Lv. 5</b><small>HP 24 / 24</small></div></div>
<div id="quest" class="hud glass"><b>FIRST STEPS</b><br>Explore Cloverfield Meadow</div>
<div id="footer" class="hud">☀ DAY · CLEAR</div>
<div id="toast" class="hud glass">A wild creature is nearby!</div>
<div id="controls">
<div id="pad">
<button class="key" id="up" aria-label="Move up">▲</button><button class="key" id="down" aria-label="Move down">▼</button><button class="key" id="left" aria-label="Move left">◀</button><button class="key" id="right" aria-label="Move right">▶</button>
</div>
<div id="actions"><button class="action alt" id="menu">BAG</button><button class="action" id="interact">INTERACT</button></div>
</div>
<div id="hint">Use the arrows to explore · Find the wild creatures!</div>
</main></div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const game=document.getElementById('game');
let W=0,H=0,dpr=1,camX=0,camY=0,last=0,toastTimer=0;
const world={w:1500,h:1100};
const player={x:730,y:565,dir:0,walk:0};
const keys={up:false,down:false,left:false,right:false};
const creatures=[
{x:570,y:430,type:'moss',name:'Mossbun',seen:false},
{x:970,y:510,type:'ember',name:'Cindercub',seen:false},
{x:1080,y:770,type:'dew',name:'Dewdrop',seen:false},
{x:390,y:790,type:'moss',name:'Mossbun',seen:false}
];
const trees=[];
for(let i=0;i<58;i++){let x=45+((i*197+73)%1400),y=35+((i*283+119)%1030);if(Math.abs(x-730)>150||Math.abs(y-565)>130)trees.push({x,y,s:.8+(i%5)*.12});}
const rocks=[];for(let i=0;i<22;i++)rocks.push({x:80+(i*311)%1340,y:90+(i*173)%920});
const flowers=[];for(let i=0;i<150;i++)flowers.push({x:(i*97+33)%1500,y:(i*181+27)%1100,c:['#f6e6a4','#f5b4a7','#e9d7f2','#fff4d5'][i%4]});
function resize(){const r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function path(){ctx.fillStyle='#d8bd83';ctx.beginPath();ctx.moveTo(0,650);ctx.bezierCurveTo(270,610,300,700,520,660);ctx.bezierCurveTo(780,610,850,510,1060,555);ctx.bezierCurveTo(1240,595,1300,470,1500,420);ctx.lineTo(1500,500);ctx.bezierCurveTo(1310,560,1260,680,1050,635);ctx.bezierCurveTo(820,590,740,730,530,720);ctx.bezierCurveTo(300,760,250,675,0,720);ctx.closePath();ctx.fill();
ctx.strokeStyle='#ead6a5';ctx.lineWidth=5;ctx.globalAlpha=.5;ctx.stroke();ctx.globalAlpha=1;}
function drawTree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(4,18,27,12,'#55764a');rounded(-7,-3,14,29,5,'#805b3b');ellipse(0,-12,28,27,'#356c49');ellipse(-14,-3,17,18,'#438456');ellipse(15,-5,17,18,'#4b905b');ellipse(-8,-22,14,13,'#5b9c62');ellipse(12,-20,13,13,'#3c7b4d');ellipse(-9,-16,4,3,'#78b875');ctx.restore();}
function drawRock(x,y){ellipse(x,y+5,15,7,'#65806d');ellipse(x,y,13,9,'#9aab92');ellipse(x-4,y-3,5,3,'#c1c9a9');}
function drawFlower(f){ellipse(f.x,f.y,2.4,2.4,f.c);ellipse(f.x+3,f.y-1,2.2,2.2,f.c);ellipse(f.x-2,f.y-3,2,2,f.c);ellipse(f.x,f.y,1.5,1.5,'#dcae58');}
function drawCreature(c,t){const bob=Math.sin(t/330+c.x)*2;ctx.save();ctx.translate(c.x,c.y+bob);ellipse(0,13,23,8,'#36533d55');
if(c.type==='moss'){ellipse(0,0,19,17,'#b6cf79');ellipse(-12,-11,7,13,'#6d9d61');ellipse(12,-11,7,13,'#6d9d61');ellipse(-12,-13,3,7,'#d7e5a4');ellipse(12,-13,3,7,'#d7e5a4');ellipse(-7,-2,2.4,3,'#263b32');ellipse(7,-2,2.4,3,'#263b32');ellipse(0,5,4,2,'#e98e83');ellipse(-4,-11,4,3,'#e8dca0');}
else if(c.type==='ember'){ellipse(0,2,19,15,'#df9464');ellipse(-11,-12,6,12,'#b95f49');ellipse(11,-12,6,12,'#b95f49');ellipse(-11,-15,2.5,6,'#f4c28b');ellipse(11,-15,2.5,6,'#f4c28b');ellipse(-7,-2,2.5,3,'#332d2a');ellipse(7,-2,2.5,3,'#332d2a');ellipse(0,6,4,2,'#fff0c9');}
else{ellipse(0,1,19,16,'#8fc8d0');ellipse(-11,-11,6,9,'#5a9fb2');ellipse(11,-11,6,9,'#5a9fb2');ellipse(-7,-3,2.5,3,'#25434c');ellipse(7,-3,2.5,3,'#25434c');ellipse(0,5,4,2,'#e7a6a0');ellipse(0,-18,5,5,'#b8e2d6');}
ctx.restore();}
function drawPlayer(t){ctx.save();ctx.translate(player.x,player.y+Math.sin(t/100)*((keys.up||keys.down||keys.left||keys.right)?1.5:0));ellipse(0,15,13,6,'#344b3c66');
rounded(-10,-2,20,20,7,'#d7a66e');rounded(-9,-14,18,17,6,'#e8c49a');rounded(-10,-21,20,12,5,'#526b91');rounded(-9,-26,18,8,4,'#3d536f');ellipse(-4,-8,1.5,2,'#303b38');ellipse(4,-8,1.5,2,'#303b38');rounded(-8,14,7,5,2,'#6b5140');rounded(2,14,7,5,2,'#6b5140');ctx.restore();}
function draw(){ctx.clearRect(0,0,W,H);const scale=Math.min(W/850,H/560);const viewW=W/scale,viewH=H/scale;camX=Math.max(0,Math.min(world.w-viewW,player.x-viewW/2));camY=Math.max(0,Math.min(world.h-viewH,player.y-viewH/2));ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);
ctx.fillStyle='#8fbd76';ctx.fillRect(0,0,world.w,world.h);
ctx.fillStyle='#9bc783';for(let i=0;i<85;i++){let x=(i*173)%world.w,y=(i*251)%world.h;ellipse(x,y,32,15,'#9bc78355');}
path();flowers.forEach(drawFlower);
ctx.fillStyle='#7eaa70';ctx.beginPath();ctx.ellipse(760,260,250,125,-.15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9bc783';ctx.beginPath();ctx.ellipse(760,260,220,102,-.15,0,Math.PI*2);ctx.fill();
rocks.forEach(r=>drawRock(r.x,r.y));
trees.sort((a,b)=>a.y-b.y);let objects=trees.map(v=>({y:v.y,fn:()=>drawTree(v.x,v.y,v.s)}));creatures.forEach(c=>objects.push({y:c.y,fn:()=>drawCreature(c,performance.now())}));objects.push({y:player.y,fn:()=>drawPlayer(performance.now())});objects.sort((a,b)=>a.y-b.y);objects.forEach(o=>o.fn());
ctx.restore();}
function nearby(){return creatures.find(c=>Math.hypot(c.x-player.x,c.y-player.y)<85);}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300);}
function interact(){const c=nearby();if(c){toast('A wild '+c.name+' is curious about you!');c.seen=true;}else toast('The meadow breeze rustles through the grass.');}
function update(dt){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){const n=Math.hypot(dx,dy);dx/=n;dy/=n;const speed=220;player.x=Math.max(22,Math.min(world.w-22,player.x+dx*speed*dt));player.y=Math.max(22,Math.min(world.h-22,player.y+dy*speed*dt));player.walk+=dt*10;if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?1:3;else player.dir=dy>0?2:0;}
const c=nearby();if(c&&!c.seen){c.seen=true;toast('A wild '+c.name+' spotted you!');}}
function loop(now){const dt=Math.min((now-last)/1000||0,.04);last=now;update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
function bindButton(id,k){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[k]=true;};const off=e=>{e.preventDefault();keys[k]=false;};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);}
bindButton('up','up');bindButton('down','down');bindButton('left','left');bindButton('right','right');
addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault();}if(e.key===' '||e.key==='Enter'){interact();e.preventDefault();}});
addEventListener('keyup',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])keys[map[e.key]]=false;});
document.getElementById('interact').addEventListener('pointerdown',e=>{e.preventDefault();interact();});
document.getElementById('menu').addEventListener('pointerdown',e=>{e.preventDefault();toast('Your bag is empty for now. Adventure awaits!');});
})();
</script>
</body>
</html>
